<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mappa Mondiale Club - Progetto Avanzato</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div id="loader"><div id="loader-progress"></div></div>
<div id="notification" class="notification-toast"></div>

<div id="timeline-container">
    <span style="font-size: 12px; font-weight: bold;">TIMELINE</span>
    <input type="range" id="timeline-slider" min="1850" max="2026" value="2026">
    <div id="year-display">Fino al 2026</div>
</div>

<button id="toggle-panel-btn" onclick="togglePanel()">☰</button>

<div id="ui-panel">
    <span class="close-panel" onclick="togglePanel()">×</span>
    <div id="search-container">
        <div class="search-row">
            <input type="text" id="search-input" placeholder="Cerca squadra o stadio... (premi /)">
            <button class="btn-ui btn-reset" onclick="resetFiltri()">✕</button>
        </div>
        <div id="search-history"></div>
    </div>
    
    <button class="btn-ui" style="width:100%;" onclick="clubCasuale()">🎲 Club Casuale</button>
    <div style="display:flex; gap:5px;">
        <button class="btn-ui btn-explore" style="flex:1;" id="btn-tour" onclick="toggleTour()">▶ Tour</button>
        <button class="btn-ui btn-explore" style="flex:1;" onclick="filtraVicinanza()">📍 Dintorni</button>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:5px;">
        <button class="btn-ui" onclick="toggleRanking('pionieri')">📜 Pionieri</button>
        <button class="btn-ui" onclick="toggleRanking('nuvole')">☁️ Nuvole</button>
        <button class="btn-ui" onclick="toggleRanking('re')">👑 Re Mondo</button>
        <button class="btn-ui" onclick="toggleRanking('cattedrali')">🏟️ Stadi</button>
    </div>

    <div id="count-box" class="stat-item">Caricamento...</div>
    <div id="stats-breakdown"></div> 
    
    <div class="stat-item" style="background: #f0f7ff; padding: 8px; border-radius: 8px; border: 1px solid #cce5ff; margin-top:10px;">
        Raggruppa loghi: 
        <label class="switch">
            <input type="checkbox" id="cluster-toggle" checked onchange="applicaFiltri()">
            <span class="slider"></span>
        </label>
    </div>

    <div class="stat-item" style="background: #fff3cd; padding: 8px; border-radius: 8px; border: 1px solid #ffeeba; margin-top:10px;">
        Mostra Badge Automatici: 
        <label class="switch">
            <input type="checkbox" id="auto-badge-toggle" checked onchange="toggleAutoBadges()">
            <span class="slider"></span>
        </label>
    </div>

    <hr>
    
    <label class="stat-item">Nazione:</label>
    <select id="filter-nazione"><option value="Tutti">Tutte le nazioni</option></select>

    <label class="stat-item">Filtro Colore Sociale:</label>
    <div class="color-picker" id="color-picker-container">
        <div class="color-circle" style="background:#FF0000;" title="Rosso" onclick="setFiltroColore('red', this)"></div>
        <div class="color-circle" style="background:#800000;" title="Granata/Amaranto" onclick="setFiltroColore('maroon', this)"></div>
        <div class="color-circle" style="background:#FFA500;" title="Arancione" onclick="setFiltroColore('orange', this)"></div>
        <div class="color-circle" style="background:#FFD700;" title="Oro" onclick="setFiltroColore('gold', this)"></div>
        <div class="color-circle" style="background:#FFFF00;" title="Giallo" onclick="setFiltroColore('yellow', this)"></div>
        <div class="color-circle" style="background:#ADFF2F;" title="Verde Chiaro/Lime" onclick="setFiltroColore('lime', this)"></div>
        <div class="color-circle" style="background:#008000;" title="Verde" onclick="setFiltroColore('green', this)"></div>
        <div class="color-circle" style="background:#87CEEB;" title="Azzurro/Celeste" onclick="setFiltroColore('lightblue', this)"></div>
        <div class="color-circle" style="background:#0000FF;" title="Blu" onclick="setFiltroColore('blue', this)"></div>
        <div class="color-circle" style="background:#000080;" title="Blu Navy/Scuro" onclick="setFiltroColore('navy', this)"></div>
        <div class="color-circle" style="background:#800080;" title="Viola" onclick="setFiltroColore('purple', this)"></div>
        <div class="color-circle" style="background:#FFC0CB;" title="Rosa" onclick="setFiltroColore('pink', this)"></div>
        <div class="color-circle" style="background:#A52A2A;" title="Marrone" onclick="setFiltroColore('brown', this)"></div>
        <div class="color-circle" style="background:#FFFFFF;" title="Bianco" onclick="setFiltroColore('white', this)"></div>
        <div class="color-circle" style="background:#808080;" title="Grigio" onclick="setFiltroColore('grey', this)"></div>
        <div class="color-circle" style="background:#000000;" title="Nero" onclick="setFiltroColore('black', this)"></div>
        <div class="color-circle active" style="background:linear-gradient(45deg, red, blue, green);" title="Tutti" onclick="setFiltroColore('Tutti', this)"></div>
    </div>
    
    <label class="stat-item">Sport:</label>
    <select id="filter-sport">
        <option value="Tutti">Tutti</option>
        <option value="Calcio">Calcio ⚽</option>
        <option value="Pallacanestro">Pallacanestro 🏀</option>
        <option value="Pallavolo">Pallavolo 🏐</option>
        <option value="Rugby">Rugby 🏉</option>
        <option value="Pallamano">Pallamano 🤾</option>
        <option value="Pallanuoto">Pallanuoto 🤽</option>
        <option value="Hockey su ghiaccio">Hockey su ghiaccio 🏒</option>
        <option value="Football americano">Football americano 🏈</option>
        <option value="Baseball">Baseball ⚾</option>
    </select>

    <label class="stat-item">Capacità Stadio:</label>
    <select id="filter-capacita">
        <option value="Tutti">Qualsiasi</option>
        <option value="small">Piccoli (&lt; 15k)</option>
        <option value="medium">Medi (15k - 30k)</option>
        <option value="large">Grandi (30k - 50k)</option>
        <option value="giant">Giganti (&gt; 50k)</option>
    </select>

    <label class="stat-item">Divisione:</label>
    <select id="filter-lega">
        <option value="Tutti">Tutte</option>
        <option value="1">1ª Divisione</option>
        <option value="2">2ª Divisione</option>
        <option value="3">3ª Divisione</option>
        <option value="4">4ª Divisione</option>
        <option value="5">5ª Divisione</option>
        <option value="6">6ª Divisione</option>
        <option value="7">7ª Divisione</option>
        <option value="8">8ª Divisione</option>
    </select>
    
    <label class="stat-item">Genere:</label>
    <select id="filter-genere">
        <option value="Tutti">Tutti</option>
        <option value="m">Maschile</option>
        <option value="f">Femminile</option>
    </select>

    <label class="stat-item">Stato Club:</label>
    <select id="filter-stato">
        <option value="Tutti">Tutti</option>
        <option value="attivo">Solo Attivi</option>
        <option value="scomparso">Solo Scomparsi</option>
    </select>
    
    <label class="stat-item">Epoca:</label>
    <select id="filter-epoca">
        <option value="Tutti">Tutte</option>
        <option value="Antiche">Prima del 1900</option>
        <option value="PrimoNovecento">1900 - 1949</option>
        <option value="SecondoNovecento">1950 - 1999</option>
        <option value="Duemila">Dal 2000 in poi</option>
    </select>

    <div class="legend-box">
    <div class="legend-item"><div class="legend-icon" style="background: #ff69b4;"></div> Femminile ♀</div>
    <div class="legend-item"><div class="legend-icon" style="background: #5bc0de;"></div> Più antico della nazione 💎</div>
    <div class="legend-item"><div class="legend-icon" style="background: #f0ad4e;"></div> Nuovo 2026 ✨</div>
    <div class="legend-item"><div class="legend-icon" style="background: #777;"></div> Club scomparso ⚰️</div>
    <div class="legend-item"><div class="legend-icon" style="background: #0047AB;"></div> Internazionale 🏆</div>
    <div class="legend-item"><div class="legend-icon" style="background: #704214;"></div> Pluricentenario 📜</div>
    <div class="legend-item"><div class="legend-icon" style="background: #800020;"></div> Stadio Cattedrale 🏟️</div>
    <div class="legend-item"><div class="legend-icon" style="background: #ffd700;"></div> Club d'Élite ⭐</div>
    <div class="legend-item"><div class="legend-icon" style="background: #f0f8ff; border:1px solid #ccc;"></div> Tetto del mondo 🏔️</div>
</div>
</div>

<div id="ranking-sidebar">
    <span class="close-panel" onclick="this.parentElement.style.display='none'">×</span>
    <h3 id="ranking-title" style="margin-top:0;">Top Ranking</h3>
    <div id="ranking-content"></div>
    <button class="btn-ui" id="btn-show-more-rank" style="width:100%; margin-top:10px; display:none;">Mostra Top 25</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OverlappingMarkerSpiderfier-Leaflet/0.2.6/oms.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
<script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
<script src="script.js"></script>
    
</body>
</html>
